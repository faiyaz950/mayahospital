<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff4f4"/><stop offset="1" stop-color="#ffd3d5"/></linearGradient>
    <linearGradient id="plasma" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffe9a8"/><stop offset="1" stop-color="#f6c75a"/></linearGradient>
    <linearGradient id="blood" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#e5323a"/><stop offset="1" stop-color="#a3121a"/></linearGradient>
  </defs>
  <style>
    .drop { animation: d 3s ease-in infinite; }
    @keyframes d { 0% { transform: translateY(-30px); opacity: 0; } 20% { opacity: 1; } 70% { transform: translateY(60px); opacity: 1; } 100% { transform: translateY(70px); opacity: 0; } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>
  <rect width="800" height="500" fill="url(#bg)"/>
  <circle cx="120" cy="420" r="170" fill="#fff" opacity=".4"/>
  <!-- tubes -->
  <g>
    <rect x="200" y="90" width="80" height="300" rx="40" fill="#fff" stroke="#c8e8ec" stroke-width="5"/>
    <rect x="208" y="150" width="64" height="100" fill="url(#plasma)"/>
    <rect x="208" y="250" width="64" height="12" fill="#fff4e0"/>
    <path d="M208 262 h64 v88 a32 32 0 0 1 -64 0z" fill="url(#blood)"/>
    <rect x="190" y="70" width="100" height="34" rx="12" fill="#0d4a58"/>
  </g>
  <g>
    <rect x="330" y="90" width="80" height="300" rx="40" fill="#fff" stroke="#c8e8ec" stroke-width="5"/>
    <rect x="338" y="170" width="64" height="80" fill="url(#plasma)"/>
    <rect x="338" y="250" width="64" height="12" fill="#fff4e0"/>
    <path d="M338 262 h64 v88 a32 32 0 0 1 -64 0z" fill="url(#blood)"/>
    <rect x="320" y="70" width="100" height="34" rx="12" fill="#136070"/>
  </g>
  <!-- syringe -->
  <g transform="rotate(30 600 240)">
    <rect x="520" y="200" width="200" height="56" rx="12" fill="#fff" stroke="#a6cbd1" stroke-width="4"/>
    <rect x="530" y="210" width="120" height="36" rx="6" fill="url(#plasma)"/>
    <rect x="720" y="216" width="40" height="24" rx="6" fill="#0d4a58"/>
    <rect x="760" y="222" width="30" height="12" rx="4" fill="#0d4a58"/>
    <rect x="470" y="223" width="50" height="10" rx="3" fill="#a6cbd1"/>
    <path d="M470 228 L420 228" stroke="#5f777c" stroke-width="3"/>
  </g>
  <g class="drop"><path d="M560 330 C 548 348 548 360 560 364 C 572 360 572 348 560 330Z" fill="#f6c75a"/></g>
</svg>
