<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff4f4"/><stop offset="1" stop-color="#fde6e7"/></linearGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#08343f"/><stop offset="1" stop-color="#04232b"/></linearGradient>
  </defs>
  <style>
    .beat { transform-origin: 300px 250px; animation: b 1.4s ease-in-out infinite; }
    @keyframes b { 0%, 100% { transform: scale(1); } 20% { transform: scale(1.06); } 40% { transform: scale(.98); } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>
  <rect width="800" height="500" fill="url(#bg)"/>
  <circle cx="680" cy="100" r="170" fill="#fff" opacity=".5"/>
  <!-- ultrasound monitor -->
  <rect x="120" y="80" width="360" height="300" rx="28" fill="#fff" stroke="#ffd3d5" stroke-width="4"/>
  <rect x="142" y="102" width="316" height="220" rx="18" fill="url(#screen)"/>
  <path d="M190 300 L300 130 L410 300 Z" fill="#136070" opacity=".35"/>
  <g class="beat">
    <ellipse cx="300" cy="250" rx="62" ry="48" fill="#a6cbd1" opacity=".55"/>
    <path d="M276 262 C 262 250, 264 230, 286 228 C 300 222, 318 230, 318 248 C 322 264, 306 276, 290 274 Z" fill="#e2f1f3" opacity=".9"/>
    <circle cx="312" cy="236" r="12" fill="#e2f1f3"/>
  </g>
  <path d="M160 300 h40 l10 -14 l12 22 l10 -8 h60" fill="none" stroke="#ff6b71" stroke-width="3" stroke-linecap="round"/>
  <rect x="160" y="340" width="120" height="14" rx="7" fill="#ffd3d5"/>
  <circle cx="420" cy="347" r="12" fill="#d42029"/>
  <!-- stand -->
  <rect x="280" y="380" width="40" height="70" fill="#a6cbd1"/>
  <rect x="220" y="440" width="160" height="16" rx="8" fill="#0d4a58"/>
  <!-- heart badge -->
  <g transform="translate(600 290)">
    <circle r="96" fill="#fff"/>
    <circle r="72" fill="#d42029"/>
    <path d="M0 30 C-34 6 -40 -18 -24 -30 C-12 -38 0 -28 0 -16 C0 -28 12 -38 24 -30 C40 -18 34 6 0 30Z" fill="#fff"/>
  </g>
  <g fill="#136070" opacity=".18"><path d="M690 420h14v-14h10v14h14v10h-14v14h-10v-14h-14z"/></g>
</svg>
